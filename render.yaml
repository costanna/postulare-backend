# Blueprint de Render: https://render.com/docs/blueprint-spec
#
# Desde el dashboard de Render → "New +" → "Blueprint", apuntando a este
# repositorio, crea la base de datos y el servicio web con esta config.
# Las variables marcadas con `sync: false` no se rellenan aquí (secretos
# o valores específicos del despliegue): Render pedirá introducirlas a
# mano la primera vez, en el dashboard del servicio.
#
# SECRET_KEY se genera solo (generateValue) - no hace falta tocarla.

databases:
  - name: postulare-db
    plan: free
    databaseName: postulare
    user: postulare

services:
  - type: web
    name: postulare-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postulare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # URL real del frontend en Vercel (sin barra final) - el navegador
      # solo puede llamar a la API desde este origen.
      - key: CORS_ORIGINS
        sync: false
      # Misma URL: se usa para construir el enlace de "recuperar contraseña"
      # en el email.
      - key: FRONTEND_URL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: es
      - key: MATCH_SEARCH_COOLDOWN_MINUTES
        value: "10"
      # Vacíos = en desarrollo el enlace de recuperación se imprime en los
      # logs en vez de enviarse (ver app/services/email.py). Rellena estos
      # cuatro si quieres que los emails salgan de verdad.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: no-reply@postulare.app
