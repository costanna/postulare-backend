# Blueprint de Render: https://render.com/docs/blueprint-spec
#
# Desde el dashboard de Render → "New +" → "Blueprint", apuntando a este
# repositorio, crea el servicio web con esta config. Las variables
# marcadas con `sync: false` no se rellenan aquí (secretos o valores
# específicos del despliegue): Render pedirá introducirlas a mano la
# primera vez, en el dashboard del servicio.
#
# SECRET_KEY se genera solo (generateValue) - no hace falta tocarla.
#
# La base de datos NO es de Render: es un proyecto de Neon
# (https://neon.tech, Postgres serverless, capa gratuita sin caducidad
# a diferencia de la de Render). DATABASE_URL se rellena a mano con la
# cadena de conexión que da Neon - ver "Despliegue en Render" en el
# README para el paso a paso.

services:
  - type: web
    name: postulare-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Cadena de conexión de Neon, la "directa" (no la del pooler) -
      # ver README. Incluye ?sslmode=require, que Neon exige.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # URL real del frontend en Vercel (sin barra final) - el navegador
      # solo puede llamar a la API desde este origen.
      - key: CORS_ORIGINS
        sync: false
      # Misma URL: se usa para construir el enlace de "recuperar contraseña"
      # en el email.
      - key: FRONTEND_URL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: es
      - key: MATCH_SEARCH_COOLDOWN_MINUTES
        value: "10"
      # Protección de la cuota de Adzuna ante una demo pública (ver README):
      # tope global de llamadas reales por día y caché de búsquedas idénticas.
      - key: ADZUNA_DAILY_LIMIT
        value: "50"
      - key: ADZUNA_CACHE_MINUTES
        value: "360"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: REGISTER_LIMIT_PER_HOUR
        value: "10"
      - key: LOGIN_LIMIT_PER_MINUTE
        value: "20"
      # Cartas de presentación con IA (opcional). Sin ANTHROPIC_API_KEY se usa una
      # plantilla gratuita. Cada carta con IA cuesta dinero: estos topes acotan el gasto.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: LLM_DAILY_LIMIT
        value: "20"
      - key: COVER_LETTER_DAILY_LIMIT_PER_USER
        value: "5"
      # Cuentas demo temporales ("Prueba la demo")
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_TTL_HOURS
        value: "24"
      # Vacíos = en desarrollo el enlace de recuperación se imprime en los
      # logs en vez de enviarse (ver app/services/email.py). Rellena estos
      # cuatro si quieres que los emails salgan de verdad.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: no-reply@postulare.app
